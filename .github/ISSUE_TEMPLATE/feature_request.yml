name: Feature idea
description: Suggest something new or a change to how something works.
title: "[idea] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help you do?
      description: The situation or problem, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you picture it working on the pager.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
