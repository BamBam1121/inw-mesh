name: build

# Two update channels.
#   beta:   every push to main -> firmware-beta.bin + ota-beta.json. Only pagers
#           with "beta updates" on see it.
#   stable: a v* tag -> a GitHub release. The site's firmware.bin, ota.json and
#           the web installer's files always come from the latest release, so a
#           beta build never replaces stable.
# A tag run creates the release and then re-runs this workflow on main, which
# deploys the site with the new release as stable.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}

      # Release builds include NFC. To ship without it (ST RFAL licence), build
      # t-lora-pager-public here instead.
      - name: Build
        run: |
          pip install platformio cryptography
          pio run -e t-lora-pager

      # Signing needs OTA_SIGNING_KEY, which only the real repo has; without it
      # sign_ota.py writes nothing and pagers see no update.
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -e
          F=site/firmware
          B=.pio/build/t-lora-pager
          mkdir -p "$F"
          VERSION=$(grep -oP 'FW_VERSION=\\"\K[0-9.]+' platformio.ini)
          NOTES=$(git log -1 --format=%s)
          # 0xFF over otadata makes the bootloader start app0 after a USB install.
          python -c "open('$F/otadata-blank.bin','wb').write(bytes([255])*8192)"
          # Our own bootloader, padded with 0xFF to the full 32KB region so an install
          # leaves nothing behind from whatever was there before. It must say 16MB
          # (header byte 3 = 0x4_): an 8MB one rejects our partition table and resets
          # forever, which is why this board once needed Launcher's bootloader.
          python -c "b=open('$B/bootloader.bin','rb').read(); assert b[0]==0xE9 and b[3]>>4==4, 'bootloader is not a 16MB image'; open('$F/bootloader.bin','wb').write(b+bytes([255])*(32768-len(b)))"

          # beta: this build
          cp "$B/firmware.bin" "$F/firmware-beta.bin"
          python tools/sign_ota.py "$F/firmware-beta.bin" "$F/ota-beta.json" "$VERSION" "$NOTES"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # stable: this build, for the release assets
            cp "$B/firmware.bin" "$B/partitions.bin" "$F/"
            python tools/sign_ota.py "$F/firmware.bin" "$F/ota.json" "$VERSION" "$NOTES"
            echo "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" > "$F/version.txt"
            STABLE="$VERSION"
          else
            # stable: the latest release, carried along
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            if [ -n "$TAG" ]; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$F" \
                --pattern firmware.bin --pattern partitions.bin --clobber
              python tools/sign_ota.py "$F/firmware.bin" "$F/ota.json" "${TAG#v}" "$TAG"
              echo "$TAG" > "$F/version.txt"
              STABLE="${TAG#v}"
            else
              cp "$B/firmware.bin" "$B/partitions.bin" "$F/"
              echo "dev ${GITHUB_SHA::7}" > "$F/version.txt"
              STABLE="$VERSION"
            fi
          fi

          # The manifests are hand-written, so their version strings used to
          # drift from the firmware (they sat at 1.1.4 while the code was on
          # 1.1.8). Stamp them with the version the site actually serves, which
          # on a non-tag run is the latest release, not this build.
          for m in "$F/../manifest-install.json" "$F/../manifest-update.json"; do
            sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$STABLE\"/" "$m"
            grep -q "\"version\": \"$STABLE\"" "$m" || { echo "failed to stamp $m"; exit 1; }
          done
          grep -h '"version"' "$F/../manifest-install.json" "$F/../manifest-update.json"
          ls -la "$F"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        # Third-party action runs with write access to releases: pinned to a commit,
        # not a movable tag (v2 = 3bb12739, checked 2026-09-16).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            site/firmware/firmware.bin
            site/firmware/partitions.bin
            site/firmware/otadata-blank.bin
            site/firmware/bootloader.bin

      # Pages only deploys from main, so hand over to a main run, which picks up
      # this release as stable.
      - name: Publish the release to the site
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'BamBam1121/inw-mesh'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main

  pages:
    if: github.repository == 'BamBam1121/inw-mesh' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
