; INW Mesh firmware for the LilyGo T-Lora Pager (ESP32-S3, SX1262, 16 MB flash,
; 8 MB QSPI PSRAM). Two environments:
;
;   t-lora-pager         the full firmware, including NFC; releases are built from this
;   t-lora-pager-public  the same without NFC and without ST's RFAL library

[env:t-lora-pager-public]
; Arduino core 2.0.17. Core 3.x changes the I2S and PCNT driver APIs used here.
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; MeshCore rewrites contacts/channels in place; this makes those saves crash-safe.
extra_scripts = pre:tools/patch_meshcore.py

board_build.mcu = esp32s3
board_build.flash_size = 16MB
; The generic devkit board stamps bootloader.bin and firmware.bin with ITS 8MB default
; unless this is set too. An 8MB bootloader rejects our partition table (SPIFFS runs
; to 0xFF0000) and resets forever, which is why this board once needed Launcher's.
board_upload.flash_size = 16MB
; app0 has to stay at 0x10000, where the bootloaders this board ships with look.
board_build.partitions = partitions_inw.csv
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -D FW_VERSION=\"1.2.1\"
    ; MeshCore's companion node is the mesh engine; its main.cpp is replaced by ours.
    -D BUILD_EXAMPLE=companion_radio
    -D EXCLUDE_FROM_EXAMPLE=main.cpp
    -I .pio/libdeps/$PIOENV/MeshCore/examples/companion_radio
    -D MAX_CONTACTS=2000
    -D MAX_GROUP_CHANNELS=40
    -D OFFLINE_QUEUE_SIZE=32
    -D BLE_PIN_CODE=123456
    ; The MeshCore phone app lists devices by this prefix.
    -D BLE_NAME_PREFIX=\"MeshCore-\"
    -D FIRMWARE_VERSION=\"INW-1.0.0\"
    -D FIRMWARE_BUILD_DATE=\"10-Sep-2026\"
    ; MeshCore reaches into RadioLib's protected members.
    -D RADIOLIB_GODMODE=1
    -D RADIOLIB_STATIC_ONLY=1
    -I variants/inw_pager
    ; The pager's own hardware (src/pager); shared app code stays in src/.
    -I src/pager
    ; ed25519 ships inside MeshCore but isn't exported as a library.
    -I .pio/libdeps/$PIOENV/MeshCore/lib/ed25519
    -I .pio/libdeps/$PIOENV/MeshCore/arch/esp32
    -D USE_SX1262
    -D RADIO_CLASS=CustomSX1262
    -D WRAPPER_CLASS=CustomSX1262Wrapper
    -D P_LORA_NSS=36
    -D P_LORA_DIO_1=14
    -D P_LORA_RESET=47
    -D P_LORA_BUSY=48
    -D P_LORA_SCLK=35
    -D P_LORA_MISO=33
    -D P_LORA_MOSI=34
    ; From Meshtastic's tlora-pager variant.
    -D SX126X_DIO3_TCXO_VOLTAGE=3.0f
    -D SX126X_DIO2_AS_RF_SWITCH=true
    -D SX126X_RX_BOOSTED_GAIN=1
    -D SX126X_CURRENT_LIMIT=140
    ; Inland Northwest mesh defaults (changeable on the device).
    -D LORA_FREQ=910.525
    -D LORA_BW=62.5
    -D LORA_SF=7
    -D LORA_CR=5
    -D LORA_TX_POWER=22

build_src_filter = +<*> -<tdeck/> -<nfcapp.cpp> +<../variants/inw_pager/*.cpp> +<../.pio/libdeps/$PIOENV/MeshCore/lib/ed25519/*.c>
lib_ldf_mode = deep+

lib_deps =
    ; Exact versions, so a release builds what was tested on the pager: the screen
    ; changes work round a LovyanGFX quirk (fx.cpp), and patch_meshcore.py edits
    ; MeshCore's source by pattern. Bump them on purpose, then test.
    lovyan03/LovyanGFX @ 1.2.30
    bblanchon/ArduinoJson @ ^7.2.0
    https://github.com/meshcore-dev/MeshCore.git#e94125987ed87497e706a0b54d1e80c709343980
    ; pinned to the RadioLib commit MeshCore builds against
    https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
    densaugeo/base64 @ ~1.4.0
    rweather/Crypto @ ^0.4.0
    adafruit/RTClib @ ^2.1.3
    melopero/Melopero RV3028 @ ^1.1.0
    electroniccats/CayenneLPP @ 1.6.1

[env:t-lora-pager]
extends = env:t-lora-pager-public
build_flags =
    ${env:t-lora-pager-public.build_flags}
    -D INW_NFC=1
build_src_filter = +<*> -<tdeck/> +<../variants/inw_pager/*.cpp> +<../.pio/libdeps/$PIOENV/MeshCore/lib/ed25519/*.c>
lib_deps =
    ${env:t-lora-pager-public.lib_deps}
    ; ST RFAL + NDEF for the ST25R3916 (ST SLA0052, see licenses/).
    lewisxhe/ST25R3916-NFC-RFAL @ 1.0.0

; Local only, never built by CI: the release build plus USB test commands for
; checking animations frame by frame (fx, gbframe, powershow) and running from
; the battery with the cable in (batt hiz). pio run -e t-lora-pager-dev
[env:t-lora-pager-dev]
extends = env:t-lora-pager
build_flags =
    ${env:t-lora-pager.build_flags}
    -D INW_DEV=1

; Runs on a PAGER but lays the whole UI out at the T-Deck's 320x240, so every
; T-Deck screen can be checked from USB screenshots without owning one. The panel
; shows the top 222 rows; "shot" returns the full frame. Local only.
[env:tdeck-preview]
extends = env:t-lora-pager-dev
build_flags =
    ${env:t-lora-pager-dev.build_flags}
    -D SCREEN_W=320
    -D SCREEN_H=240
    -D INW_LAYOUT_PREVIEW=1

; ---------------------------------------------------------------------------------
; LilyGo T-Deck / T-Deck Plus (ESP32-S3, SX1262, 16 MB flash, 8 MB octal PSRAM).
; Its own hardware lives in src/tdeck and variants/inw_tdeck; the app in src/ is
; shared with the pager. Built without a T-Deck on the bench: the pins and
; radio settings are the ones MeshCore's and Wadamesh's T-Deck builds run on
; real units (see src/tdeck/board_pins.h). pio run -e t-deck
[env:t-deck]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:tools/patch_meshcore.py
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_inw.csv
; Octal PSRAM on the T-Deck (the pager's is quad). DIO flash, as on the pager,
; so our bootloader reads on any flash chip it meets.
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    ; Beta: runs on a real T-Deck Plus since 2026-09-27; released alongside the pager later.
    -D FW_VERSION=\"1.2.2-beta6\"
    -D INW_TDECK=1
    -D BUILD_EXAMPLE=companion_radio
    -D EXCLUDE_FROM_EXAMPLE=main.cpp
    -I .pio/libdeps/$PIOENV/MeshCore/examples/companion_radio
    -D MAX_CONTACTS=2000
    -D MAX_GROUP_CHANNELS=40
    -D OFFLINE_QUEUE_SIZE=32
    -D BLE_PIN_CODE=123456
    -D BLE_NAME_PREFIX=\"MeshCore-\"
    -D FIRMWARE_VERSION=\"INW-1.0.0\"
    -D FIRMWARE_BUILD_DATE=\"10-Sep-2026\"
    -D RADIOLIB_GODMODE=1
    -D RADIOLIB_STATIC_ONLY=1
    -I variants/inw_tdeck
    ; The T-Deck's own hardware (src/tdeck); shared app code stays in src/.
    -I src/tdeck
    -I .pio/libdeps/$PIOENV/MeshCore/lib/ed25519
    -I .pio/libdeps/$PIOENV/MeshCore/arch/esp32
    -D USE_SX1262
    -D RADIO_CLASS=CustomSX1262
    -D WRAPPER_CLASS=CustomSX1262Wrapper
    -D P_LORA_NSS=9
    -D P_LORA_DIO_1=45
    -D P_LORA_RESET=17
    -D P_LORA_BUSY=13
    -D P_LORA_SCLK=40
    -D P_LORA_MISO=38
    -D P_LORA_MOSI=41
    ; 1.8 V TCXO (MeshCore + Wadamesh). DIO2 drives the antenna switch and MUST be
    ; true: MeshCore's T-Deck variant has false, which Wadamesh found (issue #6)
    ; leaves the PA unrouted, ~16 dB down on transmit.
    -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
    -D SX126X_DIO2_AS_RF_SWITCH=true
    -D SX126X_RX_BOOSTED_GAIN=1
    -D SX126X_CURRENT_LIMIT=140
    -D LORA_FREQ=910.525
    -D LORA_BW=62.5
    -D LORA_SF=7
    -D LORA_CR=5
    -D LORA_TX_POWER=22

build_src_filter = +<*> -<pager/> -<nfcapp.cpp> +<../variants/inw_tdeck/*.cpp> +<../.pio/libdeps/$PIOENV/MeshCore/lib/ed25519/*.c>
lib_ldf_mode = deep+
lib_deps = ${env:t-lora-pager-public.lib_deps}
